<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/images/MillerMediaLogo.png">
    <title>Adrian Miller Media - Jotform Backup Orders</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/styles.css">

    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #111625;
            --accent-primary: #7b2cbf;
            --accent-secondary: #4361ee;
            --accent-glow: rgba(67, 97, 238, 0.45);
            --text-main: #f0f0f0;
            --text-muted: #b0b8c4;
            --border-color: #2a3040;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at 20% -10%, rgba(67, 97, 238, 0.22), transparent 40%), var(--bg-dark);
            color: var(--text-main);
            font-family: 'Open Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #site-header,
        #site-footer {
            width: 100%;
            flex-shrink: 0;
        }

        main {
            width: min(960px, 95vw);
            margin: 2rem auto 3rem;
            flex: 1;
        }

        .card {
            background: linear-gradient(180deg, rgba(17, 22, 37, 0.98), rgba(17, 22, 37, 0.92));
            border: 1px solid rgba(67, 97, 238, 0.25);
            border-radius: 18px;
            padding: 2rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .card h1 {
            margin: 0 0 0.6rem;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            background: linear-gradient(90deg, #ffffff, #cfe0ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card p {
            margin: 0 auto 1.25rem;
            color: var(--text-muted);
            max-width: 640px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-radius: 999px;
            border: 1px solid transparent;
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
            box-shadow: 0 0 16px var(--accent-glow);
            padding: 0.95rem 1.65rem;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 26px var(--accent-glow);
        }

        .note {
            margin-top: 1rem;
            font-size: 0.93rem;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .card {
                padding: 1.5rem 1rem;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="site-header"></div>

    <main>
        <section class="card">
            <h1>VJH Musical Orders</h1>
            <p>Please use this order form hosted on Jotform.</p>
            <a class="btn" href="https://pci.jotform.com/form/261114462826050" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
                Open Backup Order Form
            </a>
            <p class="note">The form opens on Jotform in a new tab.</p>
        </section>
    </main>

    <div id="site-footer"></div>
    <script src="/assets/site.js"></script>
</body>
</html>
